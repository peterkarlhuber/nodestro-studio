<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Nodestro Studio · Connecting Intelligence. Build, run and trace AI agent workflows visually." />
    <meta name="theme-color" content="#151819" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F7F2" media="(prefers-color-scheme: light)" />
    <!-- One icon set, all derived from the original logo; ?v= busts caches of the old icon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Nodestro Studio</title>
    <script>
      try {
        const saved = localStorage.getItem("nodestro-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
