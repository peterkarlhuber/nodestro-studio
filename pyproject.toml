[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution keeps the name of the application: `pip install -U` replaces Nodestro 0.1 in place.
name = "nodestro"
version = "0.2.0"
description = "Nodestro Studio – a visual studio for multi-agent workflows built on Orkexa (complete local application)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    # The platform: every component at the exact commit this studio release was tested with
    # (platform/versions.json; `make check-versions` verifies they agree).
    "nodestro-api @ git+https://github.com/peterkarlhuber/nodestro-api.git@3536268370820703128aef2c86c9a7b8ee3e4a15",
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@2f1de719fe26e3e9c98b94b5b7302b3b7917eb1a",
    "nodestro-examples @ git+https://github.com/peterkarlhuber/nodestro-examples.git@c05ae453ec0f9b759d82a5e550be1d38fc3bedb6",
    "nodestro-integrations @ git+https://github.com/peterkarlhuber/nodestro-integrations.git@c349b64e65fda14234fa8e4bc0a3d9b9b21dc0f5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
nodestro = "nodestro_studio.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-studio"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# The built interface is git-ignored; artifacts puts it into the sdist and the wheel anyway
# (a wheel built from the sdist, as `python -m build` does, then still contains it).
artifacts = ["src/nodestro_studio/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_studio"]

[tool.hatch.build.targets.wheel.force-include]
# The Nodestro Assistant reads the built-in documentation (one source, see nodestro_api.docs_index).
"frontend/src/docs/chapters" = "nodestro_studio/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_studio"]
known-third-party = ["nodestro_runtime", "nodestro_api", "nodestro_examples", "nodestro_integrations"]
known-local-folder = ["architect_script", "conftest", "check_case_collisions", "check_imports", "check_versions"]

[tool.mypy]
python_version = "3.11"
strict = true
# derive_branding, docker_smoke, platform_smoke and social_preview are not typed yet (19 errors, API2-16).
files = [
  "src/nodestro_studio",
  "scripts/check_case_collisions.py",
  "scripts/check_imports.py",
  "scripts/check_versions.py",
  "scripts/checkout_components.py",
  "scripts/docker_test.py",
]
mypy_path = "src"
