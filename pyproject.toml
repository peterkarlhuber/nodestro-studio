[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution keeps the name of the application: `pip install -U` replaces Nodestro 0.1 in place.
name = "nodestro"
version = "0.2.0"
description = "Nodestro Studio – a visual studio for multi-agent workflows built on Orkexa (complete local application)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    # The platform components by compatible version range. The exact commits this studio release was tested with
    # are in the lock, platform/internal.txt (generated from platform/versions.json; `make check-versions` verifies
    # they agree): install with `pip install -r platform/internal.txt ...`.
    "nodestro-api>=0.2.0,<0.3",
    "nodestro-runtime>=0.2.0,<0.3",
    "nodestro-examples>=0.3.0,<0.4",
    "nodestro-integrations>=0.2.0,<0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    # The branding scripts (derive_branding, social_preview) are type-checked; both libraries ship their own types.
    "numpy>=2",
    "pillow>=11",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
nodestro = "nodestro_studio.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-studio"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# The built interface is git-ignored; artifacts puts it into the sdist and the wheel anyway
# (a wheel built from the sdist, as `python -m build` does, then still contains it).
artifacts = ["src/nodestro_studio/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_studio"]

[tool.hatch.build.targets.wheel.force-include]
# The Nodestro Assistant reads the built-in documentation (one source, see nodestro_api.docs_index).
"frontend/src/docs/chapters" = "nodestro_studio/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_studio"]
known-third-party = ["nodestro_runtime", "nodestro_api", "nodestro_examples", "nodestro_integrations"]
known-local-folder = ["architect_script", "conftest", "check_case_collisions", "check_imports", "check_versions", "check_dependency_policy", "check_tabrion_source"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/nodestro_studio",
  "scripts/check_case_collisions.py",
  "scripts/check_imports.py",
  "scripts/lock_check.py",
  "scripts/pip_cutoff.py",
  "scripts/bump_pins.py",
  "scripts/check_versions.py",
  "scripts/check_dependency_policy.py",
  "scripts/check_tabrion_source.py",
  "scripts/checkout_components.py",
  "scripts/mup_translation_check.py",
  "scripts/derive_branding.py",
  "scripts/docker_smoke.py",
  "scripts/docker_test.py",
  "scripts/platform_smoke.py",
  "scripts/social_preview.py",
]
mypy_path = "src"
