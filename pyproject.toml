[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution keeps the name of the application: `pip install -U` replaces Nodestro 0.1 in place.
name = "nodestro"
version = "0.2.0"
description = "Nodestro Studio – a visual studio for multi-agent workflows built on Orkexa (complete local application)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    # The platform: every component at the exact commit this studio release was tested with
    # (platform/versions.json; `make check-versions` verifies they agree).
    "nodestro-api @ git+https://github.com/peterkarlhuber/nodestro-api.git@db6a6969db27e36d8f12ef3dea551bdbcaf88275",
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@d141b8f69f7dbae9eae853ae03b83ab3086599ba",
    "nodestro-examples @ git+https://github.com/peterkarlhuber/nodestro-examples.git@660e9a913322578c3fe31a6e9d807d53d53ed228",
    "nodestro-integrations @ git+https://github.com/peterkarlhuber/nodestro-integrations.git@07dc1fdb4f463a79d3f15a3ad1ea05c2d1c806ff",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    # scripts/check_versions.py reads pyproject.toml files (tomllib is built in from 3.11).
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
nodestro = "nodestro_studio.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-studio"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# The built interface is git-ignored; artifacts puts it into the sdist and the wheel anyway
# (a wheel built from the sdist, as `python -m build` does, then still contains it).
artifacts = ["src/nodestro_studio/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_studio"]

[tool.hatch.build.targets.wheel.force-include]
# The Nodestro Assistant reads the built-in documentation (one source, see nodestro_api.docs_index).
"frontend/src/docs/chapters" = "nodestro_studio/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_studio"]
known-third-party = ["nodestro_runtime", "nodestro_api", "nodestro_examples", "nodestro_integrations"]
known-local-folder = ["architect_script", "conftest", "check_imports", "check_versions"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nodestro_studio"]
mypy_path = "src"
