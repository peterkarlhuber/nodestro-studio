[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution keeps the name of the application: `pip install -U` replaces Nodestro 0.1 in place.
name = "nodestro"
version = "0.2.0"
description = "Nodestro Studio – a visual studio for multi-agent workflows built on Orkexa (complete local application)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    # The platform: every component at the exact commit this studio release was tested with
    # (platform/versions.json; `make check-versions` verifies they agree).
    "nodestro-api @ git+https://github.com/peterkarlhuber/nodestro-api.git@3e0a874096a48e7cb1f9e40d53ff3b6e5af00b7b",
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@0369132fadf3fd2b96ead8c03774f420aaf9d5b6",
    "nodestro-examples @ git+https://github.com/peterkarlhuber/nodestro-examples.git@b7a1d65c096b93509aa9aa374fcc31fa7e785099",
    "nodestro-integrations @ git+https://github.com/peterkarlhuber/nodestro-integrations.git@0de02d09176b3e0ddf3041f8cb2f9480681b4abd",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
nodestro = "nodestro_studio.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-studio"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# The built interface is git-ignored; artifacts puts it into the sdist and the wheel anyway
# (a wheel built from the sdist, as `python -m build` does, then still contains it).
artifacts = ["src/nodestro_studio/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_studio"]

[tool.hatch.build.targets.wheel.force-include]
# The Nodestro Assistant reads the built-in documentation (one source, see nodestro_api.docs_index).
"frontend/src/docs/chapters" = "nodestro_studio/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_studio"]
known-third-party = ["nodestro_runtime", "nodestro_api", "nodestro_examples", "nodestro_integrations"]
known-local-folder = ["architect_script", "conftest", "check_case_collisions", "check_imports", "check_versions"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_studio"]
mypy_path = "src"
