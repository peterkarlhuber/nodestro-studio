name: Platforms

# The installed studio (API, interface and runtime at the pinned commits) must start on every system the desktop
# targets, also without the built-in Linux sandbox and without Docker: then only code that needs isolation is
# refused. scripts/platform_smoke.py starts the server as a desktop user would and checks API, settings and the
# interface.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  start:
    name: start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (arm64); macos-15-intel: x86-64; windows-11-arm: ARM64.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install the studio at the pinned commits
        run: |
          # Windows ARM64: cryptography (google-auth via orkexa) has win_arm64 wheels only up to 46.0.3.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "cryptography==46.0.3" > "$RUNNER_TEMP/constraints.txt"
            export PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt"
          fi
          pip install .
      - name: System
        run: python -c "import platform, sys; print(sys.platform, platform.machine(), platform.platform())"
      - name: Start API, runtime and interface
        run: python scripts/platform_smoke.py
