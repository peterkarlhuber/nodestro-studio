name: Docker

# The whole execution chain with a real Docker-compatible engine: the installed studio (API, runtime, Orkexa's
# DockerSandbox at the pinned commits) finds the engine itself, passes the preflight and the in-container self-test,
# runs an AI-generated (untrusted) tool in a container, removes the container after a timeout and after a cancelled
# run, and refuses the tool once the engine is unreachable or stopped (scripts/docker_smoke.py). Only the AI model is
# a local stand-in endpoint; nothing in the sandbox chain is simulated.
#
# Where GitHub's hosted runners can run Linux containers:
# - ubuntu-latest: Docker Engine is preinstalled (rootful, cgroup v2).
# - macos-15-intel: Colima (a Lima VM with Docker Engine) through nested virtualization, which Intel runners have.
# Not possible on hosted runners, so there is no job for them (see docs/TODO.md, ST-033):
# - macos-latest (Apple Silicon): no nested virtualization, so no VM and no Linux engine (Colima, Docker Desktop).
# - windows-latest / windows-11-arm: the preinstalled engine (if any) runs Windows containers only, and WSL 2 / Docker
#   Desktop need nested virtualization the hosted runners do not offer. The "unsuitable" job checks the real refusal.
# - Docker Desktop itself cannot be installed on hosted runners (license, virtualization): Docker Desktop on real
#   hardware remains a manual release check, with the one command the job "one-command" runs here
#   (docs/testing/docker-desktop.md).
on:
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "scripts/docker_smoke.py"
      - "scripts/docker_test.py"
      - "scripts/mac_docker_test.sh"
      - "pyproject.toml"
      - "platform/versions.json"
  push:
    branches: [master]
    paths:
      - ".github/workflows/docker.yml"
      - "scripts/docker_smoke.py"
      - "scripts/docker_test.py"
      - "scripts/mac_docker_test.sh"
      - "pyproject.toml"
      - "platform/versions.json"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: docker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stop: sudo systemctl stop docker.socket docker.service
          - os: macos-15-intel
            stop: colima stop
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the studio at the pinned commits
        run: |
          pip install -r platform/internal.txt .
      # Colima's defaults are larger than a hosted Intel runner (4 CPUs, 14 GB); the Virtualization framework (vz)
      # is tried first, QEMU if it does not start.
      - name: Install Colima (macOS Intel)
        id: colima
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          echo "version=$(colima version | awk 'NR==1 {print $3}')" >> "$GITHUB_OUTPUT"
      # The VM image comes from a GitHub release of colima-core; when that download fails (HTTP 504 on 2026-11-08 for
      # over an hour), the cached image keeps the job independent of it.
      - name: Colima VM image cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/colima
            ~/Library/Caches/lima
          key: colima-image-${{ runner.os }}-${{ runner.arch }}-${{ steps.colima.outputs.version }}
      - name: Start Colima (macOS Intel)
        if: runner.os == 'macOS'
        run: |
          # Three attempts, vz first and QEMU as fallback each time, with a pause for transient download errors.
          for attempt in 1 2 3; do
            if colima start --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            brew list qemu >/dev/null 2>&1 || brew install qemu
            if colima start --vm-type qemu --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            if [ "$attempt" = 3 ]; then echo "::error::Colima did not start in 3 attempts"; exit 1; fi
            echo "::warning::Colima start attempt $attempt failed; retrying in $((attempt * 90)) s"
            sleep $((attempt * 90))
          done
          colima status
      - name: Engine
        run: |
          python -c "import platform, sys; print(sys.platform, platform.machine(), platform.platform())"
          docker version
          docker info
      - name: AI-generated tool in a real container
        run: python scripts/docker_smoke.py --ready-timeout 1200 --stop-engine "${{ matrix.stop }}"

  # The one command a person runs on Docker Desktop (docs/testing/docker-desktop.md), itself: from a fresh checkout,
  # scripts/mac_docker_test.sh finds Python, scripts/docker_test.py installs the studio into its own environment,
  # runs docker_smoke.py, stops and starts the engine for step 9, writes the redacted report and cleans up. The
  # engine is Docker Engine (ubuntu) or Colima (macOS Intel), not Docker Desktop: the wrapper is proven here, Docker
  # Desktop itself stays a manual check.
  one-command:
    name: one command (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stop: sudo systemctl stop docker.socket docker.service
            start: sudo systemctl start docker.socket docker.service
          - os: macos-15-intel
            stop: colima stop
            start: colima start
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Colima (macOS Intel)
        id: colima
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          echo "version=$(colima version | awk 'NR==1 {print $3}')" >> "$GITHUB_OUTPUT"
      # The VM image comes from a GitHub release of colima-core; when that download fails (HTTP 504 on 2026-11-08 for
      # over an hour), the cached image keeps the job independent of it.
      - name: Colima VM image cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/colima
            ~/Library/Caches/lima
          key: colima-image-${{ runner.os }}-${{ runner.arch }}-${{ steps.colima.outputs.version }}
      - name: Start Colima (macOS Intel)
        if: runner.os == 'macOS'
        run: |
          # Three attempts, vz first and QEMU as fallback each time, with a pause for transient download errors.
          for attempt in 1 2 3; do
            if colima start --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            brew list qemu >/dev/null 2>&1 || brew install qemu
            if colima start --vm-type qemu --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            if [ "$attempt" = 3 ]; then echo "::error::Colima did not start in 3 attempts"; exit 1; fi
            echo "::warning::Colima start attempt $attempt failed; retrying in $((attempt * 90)) s"
            sleep $((attempt * 90))
          done
      - name: The one command
        run: |
          bash scripts/mac_docker_test.sh --work "$RUNNER_TEMP/nodestro-docker-test" --yes \
            --stop-command "${{ matrix.stop }}" --start-command "${{ matrix.start }}"
      - name: Only the test's own resources are gone, and the report is written
        if: always()
        run: |
          work="$RUNNER_TEMP/nodestro-docker-test"
          ls -la "$work"
          test ! -e "$work/venv" && test ! -e "$work/run"
          left="$(docker ps -aq --filter label=org.orkexa.sandbox)"
          test -z "$left" || { docker ps -a; exit 1; }
          cat "$work"/report-*.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-report-${{ matrix.os }}
          path: ${{ runner.temp }}/nodestro-docker-test/*.zip
          if-no-files-found: warn

  # Windows runners: no Linux containers. The real check here is the refusal: whatever engine the runner has (Windows
  # containers, a stopped service or none), AI-generated code is not run.
  unsuitable:
    name: docker unsuitable (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the studio at the pinned commits
        run: |
          pip install -r platform/internal.txt .
      - name: Untrusted code is refused without a Linux engine
        run: python scripts/docker_smoke.py --expect-unsuitable
