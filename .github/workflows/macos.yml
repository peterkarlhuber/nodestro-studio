name: macOS frontend

# The frontend build on a case-insensitive file system (macOS default APFS), where file names that differ
# only in case clash. Runs when the frontend changes; scripts/check_case_collisions.py guards every PR.
on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/macos.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: macos-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 4.7 min (successful runs 2026-11-01..07)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
