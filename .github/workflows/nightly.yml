name: Nightly

# CI-FAST S4: every workflow of this repo against master once a night, a test-ID inventory, and the early-warning
# signal "components at master" (the studio with each component at its current master instead of its pin). A red
# night opens (or comments on) the issue "Nightly failed"; the next green night closes it. Nothing here publishes.
on:
  schedule:
    # Staggered per repo (CI-FAST W0) so the nights do not hit the account's concurrent-job limit together.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      canary_fail:
        description: "Make the canary job fail (proves that a red nightly opens an issue)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # None of the called workflows uses secrets, so none gets `secrets: inherit`.
  ci:
    uses: ./.github/workflows/ci.yml
  docker:
    uses: ./.github/workflows/docker.yml
  macos:
    uses: ./.github/workflows/macos.yml
  platform:
    uses: ./.github/workflows/platform.yml
  platforms:
    uses: ./.github/workflows/platforms.yml

  canary:
    if: inputs.canary_fail
    runs-on: ubuntu-latest
    steps:
      # Proves that a red nightly opens an issue (CI-FAST W0 acceptance).
      - run: exit 1

  # The test IDs of this night (backend and interface), so later waves can compare what ran with what exists.
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Collect the backend test IDs
        run: |
          python -m pytest --collect-only -q -p no:cacheprovider > test-ids.txt || true
          count=$(grep -cE '(\]|::[A-Za-z0-9_]+)$' test-ids.txt || true)
          if [ "$count" -lt 1 ]; then cat test-ids.txt; echo "::error::No backend test IDs collected"; exit 1; fi
          sum=$(grep -E '(\]|::[A-Za-z0-9_]+)$' test-ids.txt | sort | sha256sum | cut -d' ' -f1)
          echo "Backend (pytest): $count test IDs, sha256 of the sorted list $sum" >> "$GITHUB_STEP_SUMMARY"
      # `vitest list` collects without running the tests; it needs the installed dependencies only.
      - name: Collect the interface test IDs
        working-directory: frontend
        run: |
          npm ci
          npx vitest list > ../frontend-test-ids.txt || true
          count=$(grep -c . ../frontend-test-ids.txt || true)
          if [ "$count" -lt 1 ]; then echo "::error::No interface test IDs collected"; exit 1; fi
          sum=$(sort ../frontend-test-ids.txt | sha256sum | cut -d' ' -f1)
          echo "Interface (vitest): $count test IDs, sha256 of the sorted list $sum" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ids
          path: |
            test-ids.txt
            frontend-test-ids.txt

  # Early warning: like platform.yml's `components` job (Python 3.13), but nodestro-runtime, -api, -examples,
  # -integrations and orkexa (pulled in by runtime and API through a direct URL) at their current master instead of
  # the pins. Red here means "the next pin bump will break", not "master is broken"; platform/versions.json and the
  # pins in pyproject.toml are only read, never changed. A first preview of the integration lock idea.
  components-at-master:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPONENTS: nodestro-runtime nodestro-api nodestro-examples nodestro-integrations
      OVERRIDDEN: nodestro-runtime nodestro-api nodestro-examples nodestro-integrations orkexa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      # One SHA per repository, read once: the install and the test checkouts then use the very same commit, even if
      # a master moves during the run.
      - name: Read the master commits
        run: |
          {
            echo "### Components at master"
            echo
            echo "| Component | master | pin (platform/versions.json) |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/master.txt"
          for name in $OVERRIDDEN; do
            sha=$(git ls-remote "https://github.com/peterkarlhuber/$name.git" refs/heads/master | cut -f1)
            test -n "$sha" || { echo "::error::No master commit for $name"; exit 1; }
            pin=$(python -c 'import json,sys; print(json.load(open("platform/versions.json"))["components"][sys.argv[1]]["commit"])' "$name")
            echo "$name $sha" >> "$RUNNER_TEMP/master.txt"
            echo "| $name | \`$sha\` | \`$pin\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$RUNNER_TEMP/master.txt"
      - name: Check out every component at its master commit
        run: |
          while read -r name sha; do
            case " $COMPONENTS " in *" $name "*) ;; *) continue ;; esac
            checkout="$RUNNER_TEMP/components/$name"
            git clone --quiet --filter=blob:none "https://github.com/peterkarlhuber/$name.git" "$checkout"
            git -C "$checkout" -c advice.detachedHead=false checkout --quiet "$sha"
            echo "$name @ $sha"
          done < "$RUNNER_TEMP/master.txt"
      # An override replaces every requirement of that name, extras included: the extras that the studio and the
      # components ask for (orkexa[all,pdf,local,convert] in the runtime) must be in the override, or uv drops
      # their dependencies.
      - name: Write the overrides
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          master = dict(line.split() for line in (temp / "master.txt").read_text().splitlines())
          norm = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          extras: dict[str, set[str]] = {name: set() for name in master}
          pyprojects = [Path("pyproject.toml")]
          pyprojects += [temp / "components" / name / "pyproject.toml" for name in os.environ["COMPONENTS"].split()]
          for pyproject in pyprojects:
              for requirement in tomllib.loads(pyproject.read_text())["project"].get("dependencies", []):
                  match = re.match(r"\s*([A-Za-z0-9._-]+)\s*(?:\[([^\]]*)\])?", requirement)
                  if match and norm(match[1]) in extras and match[2]:
                      extras[norm(match[1])] |= {e.strip() for e in match[2].split(",") if e.strip()}
          lines = []
          for name, sha in master.items():
              extra = f"[{','.join(sorted(extras[name]))}]" if extras[name] else ""
              lines.append(f"{name}{extra} @ git+https://github.com/peterkarlhuber/{name}.git@{sha}")
          (temp / "overrides.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Install the studio with the components at master
        run: |
          pip install uv==0.11.32
          # pglast: the runtime's static tenant-isolation check (tests/test_tenant_filters.py, security review SR-01).
          uv pip install --system --override "$RUNNER_TEMP/overrides.txt" \
            -e ".[dev]" pytest-asyncio httpx "pglast>=7,<9"
      - name: Only the master commits were installed
        id: installed
        run: |
          python - <<'PY'
          import json, os, importlib.metadata as m
          from pathlib import Path

          master = dict(line.split() for line in (Path(os.environ["RUNNER_TEMP"]) / "master.txt").read_text().splitlines())
          for name, sha in master.items():
              url = json.loads(m.distribution(name).read_text("direct_url.json") or "{}")
              commit = url.get("vcs_info", {}).get("commit_id")
              assert commit == sha, (name, commit, sha)
              print(name, m.version(name), commit)
          PY
      # Every suite runs even if an earlier one fails, so one night shows every component that breaks.
      - run: python scripts/check_imports.py
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
      - name: nodestro-runtime
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: cd "$RUNNER_TEMP/components/nodestro-runtime" && python -m pytest -p no:cacheprovider
      - name: nodestro-examples
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: cd "$RUNNER_TEMP/components/nodestro-examples" && python -m pytest -p no:cacheprovider
      - name: nodestro-integrations
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: cd "$RUNNER_TEMP/components/nodestro-integrations" && python -m pytest -p no:cacheprovider
      - name: nodestro-api
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: cd "$RUNNER_TEMP/components/nodestro-api" && python -m pytest -p no:cacheprovider
      - name: nodestro-studio (with the upgrade from 0.1)
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: pytest

  report:
    needs: [ci, docker, macos, platform, platforms, canary, inventory, components-at-master]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly failed"
          failed=$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -n "$failed" ]; then
            body="Nightly run $RUN_URL failed: $failed (commit $GITHUB_SHA)."
            if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Nightly run $RUN_URL is green again (commit $GITHUB_SHA). Closing."
            gh issue close "$number"
          fi
