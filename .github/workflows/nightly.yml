name: Nightly

# CI-FAST S4: every workflow of this repo against master once a night and a test-ID inventory. The early-warning
# signal "components at master" is its own workflow (components-at-master.yml), so it never changes this result. A red
# night opens (or comments on) the issue "Nightly failed"; the next green night closes it. Nothing here publishes.
on:
  schedule:
    # Staggered per repo (CI-FAST W0) so the nights do not hit the account's concurrent-job limit together.
    # GitHub starts scheduled runs about 6 h late on this account (measured 2026-11-08..11): the cron sits 6 h
    # before the night.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      canary_fail:
        description: "Make the canary job fail (proves that a red nightly opens an issue)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # None of the called workflows uses secrets, so none gets `secrets: inherit`.
  ci:
    uses: ./.github/workflows/ci.yml
  docker:
    uses: ./.github/workflows/docker.yml
  macos:
    uses: ./.github/workflows/macos.yml
  platform:
    uses: ./.github/workflows/platform.yml
  platforms:
    uses: ./.github/workflows/platforms.yml

  canary:
    if: inputs.canary_fail
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-FAST AP1: no run data yet (nightly-only); a short job
    steps:
      # Proves that a red nightly opens an issue (CI-FAST W0 acceptance).
      - run: exit 1

  # The test IDs of this night (backend and interface), so later waves can compare what ran with what exists.
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-FAST AP1: no run data yet (nightly-only); as the other repos' inventory jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r platform/internal.txt -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Collect the backend test IDs
        run: |
          python -m pytest --collect-only -q -p no:cacheprovider > test-ids.txt || true
          count=$(grep -cE '(\]|::[A-Za-z0-9_]+)$' test-ids.txt || true)
          if [ "$count" -lt 1 ]; then cat test-ids.txt; echo "::error::No backend test IDs collected"; exit 1; fi
          sum=$(grep -E '(\]|::[A-Za-z0-9_]+)$' test-ids.txt | sort | sha256sum | cut -d' ' -f1)
          echo "Backend (pytest): $count test IDs, sha256 of the sorted list $sum" >> "$GITHUB_STEP_SUMMARY"
      # `vitest list` collects without running the tests; it needs the installed dependencies only.
      - name: Collect the interface test IDs
        working-directory: frontend
        run: |
          npm ci
          npx vitest list > ../frontend-test-ids.txt || true
          count=$(grep -c . ../frontend-test-ids.txt || true)
          if [ "$count" -lt 1 ]; then echo "::error::No interface test IDs collected"; exit 1; fi
          sum=$(sort ../frontend-test-ids.txt | sha256sum | cut -d' ' -f1)
          echo "Interface (vitest): $count test IDs, sha256 of the sorted list $sum" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ids
          path: |
            test-ids.txt
            frontend-test-ids.txt

  # TABRION RC-7 (VER-1): requirements/tabrion.txt on the axentra and orkexa default branches against the tabrion
  # commit of platform/versions.json (the one nodestro-runtime and nodestro-api pin). Report only: the script always
  # exits 0 and writes ::warning:: lines and a step summary; the job is not in `report`'s needs, so drift never turns
  # the night red.
  tabrion-drift:
    runs-on: ubuntu-latest
    # Report only: an unexpected crash (pip, an unreadable repository) must not mark the nightly run failed either.
    continue-on-error: true
    timeout-minutes: 10 # CI-FAST AP1: no run data yet (nightly-only); like the pins job (p99 1.7 min)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Report tabrion drift
        run: |
          python -m pip install "packaging>=24"
          python scripts/check_versions.py --drift

  report:
    needs: [ci, docker, macos, platform, platforms, canary, inventory]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-FAST AP1: no run data yet (nightly-only); a short job
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly failed"
          failed=$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -n "$failed" ]; then
            body="Nightly run $RUN_URL failed: $failed (commit $GITHUB_SHA)."
            if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Nightly run $RUN_URL is green again (commit $GITHUB_SHA). Closing."
            gh issue close "$number"
          fi
