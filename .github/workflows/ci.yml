name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # File names that differ only in case break the checkout or the build on macOS and Windows.
  case-clashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_case_collisions.py

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Nodestro components and orkexa are private: pip and git clone them with a token that can read them.
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Documentation, the command line, and the upgrade from Nodestro 0.1 data.
      - run: pytest
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails on high or critical advisories in the production dependencies.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  package:
    # The wheel contains the built interface and the documentation and starts on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: pip install build==1.6.1 && python -m build
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install the wheel into a fresh environment (private dependencies read with NODESTRO_READ)
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
      - name: Start the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/nodestro" --data-dir "$RUNNER_TEMP/data" --no-browser --port 8000 > nodestro.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root"' || { cat nodestro.log; exit 1; }
          curl -sf http://127.0.0.1:8000/api/meta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  browser:
    # All browser suites, each against its own Nodestro; models and package index are simulated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # The Nodestro components and orkexa are private: pip and git clone them with a token that can read them.
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          pip install -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: scripts/e2e.sh
        env:
          JOURNEY_REPORT: ${{ runner.temp }}/journeys
      # Interface cost of the six user tasks (UX-J); a report, not a gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journeys
          path: ${{ runner.temp }}/journeys/
          if-no-files-found: ignore
