name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Nodestro components and orkexa are private: pip and git clone them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Documentation, the command line, and the upgrade from Nodestro 0.1 data.
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    # The wheel contains the built interface and the documentation and starts on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Nodestro components and orkexa are private: pip and git clone them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: pip install build && python -m build
      - name: Install the wheel into a fresh environment and start it
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/nodestro" --data-dir "$RUNNER_TEMP/data" --no-browser --port 8000 > nodestro.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root"' || { cat nodestro.log; exit 1; }
          curl -sf http://127.0.0.1:8000/api/meta
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  browser:
    # All browser suites, each against its own Nodestro; models and package index are simulated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The Nodestro components and orkexa are private: pip and git clone them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: scripts/e2e.sh
        env:
          JOURNEY_REPORT: ${{ runner.temp }}/journeys
      # Interface cost of the six user tasks (UX-J); a report, not a gate.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journeys
          path: ${{ runner.temp }}/journeys/
          if-no-files-found: ignore
