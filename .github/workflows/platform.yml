name: Platform

# The whole platform at the commits of platform/versions.json: pins, dependency direction, every
# component's tests against one installation, the SDKs against the API, and the browser suites.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.7 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the version pins
        run: |
          python -m pip install "packaging>=24"
          python scripts/check_versions.py

  components:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 35 # CI-FAST AP1: p99 21.0 min, slowest entry 3.13 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      # The studio pins every component: this one installation is the platform under test.
      # Third-party packages as uploaded before the shared cutoff (platform/uploaded-prior-to): the set the server
      # image and the desktop backend ship. pip_cutoff.py fails unless this pip (>= 26.0) has --uploaded-prior-to.
      - name: Install
        run: |
          cutoff=$(python -I scripts/pip_cutoff.py)
          # pglast: the runtime's static tenant-isolation check (tests/test_tenant_filters.py, security review SR-01).
          pip install --uploaded-prior-to "$cutoff" -r platform/internal.txt -e ".[dev]" pytest-asyncio httpx "pglast>=7,<9"
          # The components' test suites need tabrion's test fixtures (nodestro-runtime and nodestro-api [dev]): the
          # locked commit from the server lock, with the extras those suites use.
          tabrion=$(sed -n 's/^tabrion @ /tabrion[testing,postgres] @ /p' platform/internal-server.txt)
          pip install --uploaded-prior-to "$cutoff" "$tabrion"
          # CI-FAST AP6: the three longest component suites run on every CPU of the runner (pytest-xdist).
          pip install --uploaded-prior-to "$cutoff" pytest-xdist==3.8.0
          pip freeze > "$RUNNER_TEMP/pip-freeze-components-${{ matrix.python }}.txt"
      - name: The installed packages (pip freeze)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-freeze-components-${{ matrix.python }}
          path: ${{ runner.temp }}/pip-freeze-components-${{ matrix.python }}.txt
      - run: python scripts/check_imports.py
      - name: Check out every component at its pinned commit
        run: |
          python scripts/checkout_components.py "$RUNNER_TEMP/components"
      # Each suite runs from its checkout but imports the installed (pinned) packages.
      # CI-FAST AP6: runtime, examples and api in parallel workers; each collects its test IDs first and
      # scripts/check_test_ids.py fails unless every collected ID is in the suite's report exactly once.
      - name: nodestro-runtime
        run: |
          cd "$RUNNER_TEMP/components/nodestro-runtime"
          python -m pytest -p no:cacheprovider --collect-only -q > "$RUNNER_TEMP/ids-runtime.txt"
          python -m pytest -p no:cacheprovider -n auto --dist loadfile --junitxml="$RUNNER_TEMP/junit-runtime.xml"
          python "$GITHUB_WORKSPACE/scripts/check_test_ids.py" "$RUNNER_TEMP/ids-runtime.txt" "$RUNNER_TEMP/junit-runtime.xml"
      - name: nodestro-examples
        run: |
          cd "$RUNNER_TEMP/components/nodestro-examples"
          python -m pytest -p no:cacheprovider --collect-only -q > "$RUNNER_TEMP/ids-examples.txt"
          python -m pytest -p no:cacheprovider -n auto --junitxml="$RUNNER_TEMP/junit-examples.xml"
          python "$GITHUB_WORKSPACE/scripts/check_test_ids.py" "$RUNNER_TEMP/ids-examples.txt" "$RUNNER_TEMP/junit-examples.xml"
      - name: nodestro-integrations
        run: cd "$RUNNER_TEMP/components/nodestro-integrations" && python -m pytest -p no:cacheprovider
      - name: nodestro-api
        run: |
          cd "$RUNNER_TEMP/components/nodestro-api"
          python -m pytest -p no:cacheprovider --collect-only -q > "$RUNNER_TEMP/ids-api.txt"
          python -m pytest -p no:cacheprovider -n auto --junitxml="$RUNNER_TEMP/junit-api.xml"
          python "$GITHUB_WORKSPACE/scripts/check_test_ids.py" "$RUNNER_TEMP/ids-api.txt" "$RUNNER_TEMP/junit-api.xml"
      - name: nodestro-studio (with the upgrade from 0.1)
        run: pytest
      # After every suite: each component (and orkexa) is still installed from its pinned repository and commit at
      # the pinned version, no package declares another commit of a component, and no server extras leaked in. The
      # same script checks the server image (finalize.sh) and the desktop backend (build_backend.sh).
      - name: Only the pinned packages were imported
        run: python -I scripts/lock_check.py --profile studio
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  sdk:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 2.0 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          cutoff=$(python -I scripts/pip_cutoff.py)
          pip install --uploaded-prior-to "$cutoff" -r platform/internal.txt -e ".[dev]"
      # The SDK's test extra pins nodestro-api too: pip refuses if it differs from the studio's.
      - name: Check out and install the pinned SDK
        run: |
          cutoff=$(python -I scripts/pip_cutoff.py)
          python scripts/checkout_components.py "$RUNNER_TEMP/components" nodestro-sdk
          pip install --uploaded-prior-to "$cutoff" "$RUNNER_TEMP/components/nodestro-sdk/python[test]"
      - name: Python SDK against the API
        run: cd "$RUNNER_TEMP/components/nodestro-sdk/python" && python -m pytest -p no:cacheprovider
      - name: TypeScript SDK against the API
        run: |
          cd "$RUNNER_TEMP/components/nodestro-sdk/typescript"
          npm ci
          npm run typecheck
          NODESTRO_SDK_PYTHON=python npm test

  browser:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 30 # CI-FAST AP1: p99 19.4 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          cutoff=$(python -I scripts/pip_cutoff.py)
          pip install --uploaded-prior-to "$cutoff" -r platform/internal.txt -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      # CI-FAST AP6: the default suites in two halves at the same time on this runner; the script fails unless the
      # halves together are exactly the default list of e2e.sh.
      - run: scripts/e2e_halves.sh
