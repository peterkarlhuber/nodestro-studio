name: Platform

# The whole platform at the commits of platform/versions.json: pins, dependency direction, every
# component's tests against one installation, the SDKs against the API, and the browser suites.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Check the version pins with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          python scripts/check_versions.py

  components:
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      # The studio pins every component: this one installation is the platform under test.
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          pip install -e ".[dev]" pytest-asyncio httpx
      - run: python scripts/check_imports.py
      - name: Check out every component at its pinned commit
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          python scripts/checkout_components.py "$RUNNER_TEMP/components"
      # Each suite runs from its checkout but imports the installed (pinned) packages.
      - name: nodestro-runtime
        run: cd "$RUNNER_TEMP/components/nodestro-runtime" && python -m pytest -p no:cacheprovider
      - name: nodestro-examples
        run: cd "$RUNNER_TEMP/components/nodestro-examples" && python -m pytest -p no:cacheprovider
      - name: nodestro-integrations
        run: cd "$RUNNER_TEMP/components/nodestro-integrations" && python -m pytest -p no:cacheprovider
      - name: nodestro-api
        run: cd "$RUNNER_TEMP/components/nodestro-api" && python -m pytest -p no:cacheprovider
      - name: nodestro-studio (with the upgrade from 0.1)
        run: pytest
      - name: Only the pinned packages were imported
        run: |
          python - <<'PY'
          import json, importlib.metadata as m
          pins = json.load(open("platform/versions.json"))["components"]
          for name in ("nodestro-runtime", "nodestro-api", "nodestro-examples", "nodestro-integrations"):
              url = json.loads(m.distribution(name).read_text("direct_url.json") or "{}")
              commit = url.get("vcs_info", {}).get("commit_id")
              assert commit == pins[name]["commit"], (name, commit, pins[name]["commit"])
              print(name, m.version(name), commit)
          PY
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  sdk:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          pip install -e ".[dev]"
      # The SDK's test extra pins nodestro-api too: pip refuses if it differs from the studio's.
      - name: Check out and install the pinned SDK with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          python scripts/checkout_components.py "$RUNNER_TEMP/components" nodestro-sdk
          pip install "$RUNNER_TEMP/components/nodestro-sdk/python[test]"
      - name: Python SDK against the API
        run: cd "$RUNNER_TEMP/components/nodestro-sdk/python" && python -m pytest -p no:cacheprovider
      - name: TypeScript SDK against the API
        run: |
          cd "$RUNNER_TEMP/components/nodestro-sdk/typescript"
          npm ci
          npm run typecheck
          NODESTRO_SDK_PYTHON=python npm test

  browser:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # The token exists only in this step's environment: no global Git configuration, nothing for later steps.
      - name: Install with read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/peterkarlhuber/"
          pip install -e ".[dev]"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: scripts/e2e.sh
